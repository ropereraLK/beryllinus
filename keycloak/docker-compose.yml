services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: local-keycloak

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8080:8080"

    volumes:
      - ./realm:/opt/keycloak/data/import

    restart: unless-stopped